<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소녀전선2 망명 — 황칩 필요 계산기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ccircle cx='64' cy='64' r='46' fill='%23e0a93a' stroke='%23a8761c' stroke-width='7'/%3E%3Ccircle cx='64' cy='64' r='26' fill='none' stroke='%23a8761c' stroke-width='6'/%3E%3C/svg%3E">
<style>
  :root {
    --app: #f5f7fa;
    --panel: #ffffff;
    --line: #cfd8dc;
    --head: #546e7a;
    --value: #263238;
    --muted: #607d8b;
    --field: #ffffff;
    --btn: #eceff1;
    --btn-hover: #dde3e7;
    --accent: #b8860b;
    --total-bg: #eceff1;
  }
  :root[data-theme="dark"] {
    --app: #1e2024;
    --panel: #24262b;
    --line: #3a3f47;
    --head: #97a2ad;
    --value: #e8eaed;
    --muted: #a7b0b9;
    --field: #2a2d33;
    --btn: #33373d;
    --btn-hover: #41464e;
    --accent: #e0a93a;
    --total-bg: #2f333a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 14px 12px max(14px, env(safe-area-inset-bottom));
    background: var(--app);
    color: var(--value);
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, "Noto Sans KR", sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  h1 { margin: 0; font-size: 17px; }
  .btn {
    font: inherit;
    font-size: 12.5px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--btn);
    color: var(--value);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hover); }

  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
  }
  .lead { margin: 0 0 10px; font-size: 12.5px; color: var(--head); }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  select {
    font: inherit;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--field);
    color: var(--value);
    min-width: 0;
  }
  select.item { flex: 1 1 55%; }
  select.val { flex: 1 1 45%; }
  .cost {
    flex: 0 0 58px;
    text-align: right;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .cost b { color: var(--accent); font-size: 14px; }

  .total {
    margin-top: 12px;
    padding: 12px;
    border-radius: 6px;
    background: var(--total-bg);
    text-align: center;
    font-size: 19px;
    font-weight: 700;
  }
  .total span { color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions .btn { flex: 1 1 auto; text-align: center; }

  .note {
    margin: 12px 0 0;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
  }
  a.back { color: var(--muted); font-size: 12px; text-decoration: none; }
  a.back:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    .row { flex-wrap: wrap; }
    select.item, select.val { flex: 1 1 100%; }
    .cost { flex: 1 1 100%; text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>소녀전선2 망명 — 황칩 필요 계산기</h1>
    <button class="btn" id="theme" type="button">☾ 다크</button>
  </header>

  <div class="card">
    <p class="lead">옵션을 고르고 그 수치를 고르면 필요한 황칩 개수를 더해 보여 줍니다.</p>
    <div id="rows"></div>

    <div class="total">황칩 필요 합계: <span id="total">0</span>개</div>
    <div class="actions">
      <button class="btn" id="reset" type="button">초기화</button>
    </div>
  </div>

  <p class="note">
    수치가 좋을수록 필요한 황칩이 줄어듭니다. 최고 수치는 0개입니다.<br>
    같은 옵션은 한 번만 고를 수 있어, 이미 고른 옵션은 다른 줄에서 빠집니다.
  </p>
  <p class="note"><a class="back" href="./">← 도구 목록</a></p>
</div>

<script>
"use strict";

/* ───────── 데이터 — 데스크톱 도구와 같은 표 ─────────
   항목별 (황칩 개수, 수치). 수치가 높을수록 칩이 덜 든다. */
const DATA = {
  "공격":        [[4, 17], [3, 19], [2, 21], [1, 23], [0, 24]],
  "체력":        [[4, 38], [3, 43], [2, 48], [1, 53], [0, 54]],
  "방어":        [[3, 10], [2, 12], [1, 14], [0, 16]],
  "공격 보너스": [[3, 2.6], [2, 3.0], [1, 3.4], [0, 3.8]],
  "체력 보너스": [[3, 2.6], [2, 3.0], [1, 3.4], [0, 3.8]],
  "방어 보너스": [[3, 2.6], [2, 3.0], [1, 3.4], [0, 3.8]],
  "치명타":      [[3, 3.5], [2, 4.0], [1, 4.5], [0, 5.0]],
  "치명타 피해": [[3, 3.5], [2, 4.0], [1, 4.5], [0, 5.0]],
};
const FLAT = new Set(["공격", "체력", "방어"]);
const ITEMS = Object.keys(DATA);
const ROWS = 4;

const fmt = (item, v) => FLAT.has(item) ? String(v) : v.toFixed(1) + "%";

const rowsEl = document.getElementById("rows");
const rows = [];

for (let i = 0; i < ROWS; i++) {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML =
    '<select class="item"></select><select class="val"></select>' +
    '<span class="cost"></span>';
  rowsEl.appendChild(div);
  const r = {
    item: div.querySelector(".item"),
    val: div.querySelector(".val"),
    cost: div.querySelector(".cost"),
  };
  r.item.addEventListener("change", () => { fillValues(r); refreshItems(); total(); });
  r.val.addEventListener("change", total);
  rows.push(r);
}

/* 이미 고른 옵션은 다른 줄의 목록에서 뺀다 */
function refreshItems() {
  const picked = rows.map(r => r.item.value).filter(Boolean);
  for (const r of rows) {
    const cur = r.item.value;
    r.item.innerHTML = '<option value="">옵션 선택</option>' +
      ITEMS.filter(it => !picked.includes(it) || it === cur)
           .map(it => `<option${it === cur ? " selected" : ""}>${it}</option>`)
           .join("");
  }
}

function fillValues(r) {
  const item = r.item.value;
  if (!item) {
    r.val.innerHTML = '<option value="">-</option>';
    r.cost.textContent = "";
    return;
  }
  r.val.innerHTML = '<option value="">수치 선택</option>' +
    DATA[item].map(([cost, v], i) => `<option value="${i}">${fmt(item, v)}</option>`).join("");
  r.cost.textContent = "";
}

function total() {
  let sum = 0;
  for (const r of rows) {
    const item = r.item.value;
    const idx = r.val.value;
    if (!item || idx === "") { r.cost.textContent = ""; continue; }
    const cost = DATA[item][Number(idx)][0];
    sum += cost;
    r.cost.innerHTML = `<b>${cost}</b>개`;
  }
  document.getElementById("total").textContent = sum;
}

document.getElementById("reset").addEventListener("click", () => {
  for (const r of rows) { r.item.value = ""; fillValues(r); }
  refreshItems();
  total();
});

/* ───────── 테마 ───────── */
const KEY = "hwangchip-theme";
const media = window.matchMedia("(prefers-color-scheme: dark)");
const btn = document.getElementById("theme");
function applyTheme(mode) {
  document.documentElement.dataset.theme = mode;
  btn.textContent = mode === "dark" ? "☀ 라이트" : "☾ 다크";
}
let stored = null;
try { stored = localStorage.getItem(KEY); } catch (e) { /* 저장 못 해도 동작 */ }
applyTheme(stored || (media.matches ? "dark" : "light"));
media.addEventListener("change", e => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e2) { /* 무시 */ }
  if (!saved) applyTheme(e.matches ? "dark" : "light");
});
btn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(KEY, next); } catch (e) { /* 무시 */ }
});

refreshItems();
rows.forEach(fillValues);
total();
</script>
</body>
</html>
