<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소녀전선2 망명 — 점수 피해량 비교기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cpath d='M14 110 C 40 110 70 40 116 22' fill='none' stroke='%23378ADD' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='52' cy='74' r='11' fill='%23D85A30'/%3E%3Ccircle cx='92' cy='40' r='11' fill='%23185FA5'/%3E%3C/svg%3E">
<style>
  :root {
    --app: #f5f7fa;
    --panel: #ffffff;
    --line: #cfd8dc;
    --head: #546e7a;
    --value: #263238;
    --muted: #607d8b;
    --field: #ffffff;
    --btn: #eceff1;
    --btn-hover: #dde3e7;
    --sel: #cfe3f7;

    --plot-bg: #ffffff;
    --axis: #888888;
    --grid-y: #dddddd;
    --grid-x: #f2f2f2;
    --tick: #555555;
    --curve: #378add;
    --hair: #bbbbbb;
    --tip-bg: #fff7e6;
    --tip-line: #e0c080;
    --tip-fg: #222222;
  }
  :root[data-theme="dark"] {
    --app: #1e2024;
    --panel: #24262b;
    --line: #3a3f47;
    --head: #97a2ad;
    --value: #e8eaed;
    --muted: #a7b0b9;
    --field: #2a2d33;
    --btn: #33373d;
    --btn-hover: #41464e;
    --sel: #3a5a8c;

    --plot-bg: #16181c;
    --axis: #6f767e;
    --grid-y: #2e333a;
    --grid-x: #26292f;
    --tick: #9aa2ab;
    --curve: #5aa9f5;
    --hair: #5a616a;
    --tip-bg: #3a3320;
    --tip-line: #8a7440;
    --tip-fg: #f2e6cf;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 12px 12px max(12px, env(safe-area-inset-bottom));
    background: var(--app);
    color: var(--value);
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, "Noto Sans KR", sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  .pagehead { margin: 0 0 10px; }
  .pagehead h1 { margin: 0; font-size: 17px; }
  .pagehead p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }

  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .bar label { color: var(--head); font-size: 12.5px; }
  input[type="text"] {
    flex: 1 1 180px;
    min-width: 140px;
    font: inherit;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--field);
    color: var(--value);
  }
  input:focus { outline: 2px solid var(--sel); outline-offset: -1px; }
  .btn {
    font: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--btn);
    color: var(--value);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.grow { flex: 1 1 auto; }
  .spacer { flex: 1 1 auto; }

  .main { display: flex; gap: 12px; align-items: flex-start; }
  .plot {
    flex: 1 1 auto;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--plot-bg);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 420px; touch-action: pan-y; }

  .side { flex: 0 0 300px; }
  .card {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    padding: 10px;
    margin-bottom: 10px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--head);
  }
  ul.list { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; }
  ul.list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  ul.list li.sel { background: var(--sel); }
  ul.list li .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex: 0 0 auto;
  }
  ul.list li .x { margin-left: auto; color: var(--muted); padding: 0 4px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px; }
  pre.detail {
    margin: 0;
    padding: 8px;
    min-height: 120px;
    max-height: 220px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--field);
    color: var(--value);
    font: 12.5px/1.6 "Malgun Gothic", "맑은 고딕", monospace;
    white-space: pre-wrap;
  }
  .hint { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); text-align: center; }

  @media (max-width: 820px) {
    .main { flex-direction: column; }
    .side { flex: 1 1 auto; width: 100%; }
    canvas { height: 300px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="pagehead">
    <h1>소녀전선2 망명 — 점수 피해량 비교기</h1>
  </div>

  <div class="bar">
    <label for="score">점수 입력 (쉼표 구분)</label>
    <input id="score" type="text" inputmode="numeric" placeholder="예) 21000, 28500">
    <button class="btn" id="add" type="button">추가</button>
    <button class="btn" id="clear" type="button">초기화</button>
    <span class="spacer"></span>
    <button class="btn" id="theme" type="button">☾ 다크</button>
  </div>

  <div class="main">
    <div class="plot"><canvas id="chart"></canvas></div>

    <div class="side">
      <div class="card">
        <h2>비교 목록</h2>
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty">점수를 추가하면 곡선 위에 표시됩니다.</div>
      </div>
      <div class="card">
        <h2>비교 결과 상세</h2>
        <pre class="detail" id="detail"></pre>
      </div>
    </div>
  </div>

  <p class="hint">그래프를 누르면 그 지점의 점수·피해량이 표시되고, 두 번 누르면 목록에 추가됩니다.</p>
</div>

<script>
"use strict";

/* ───────── 계산 — 데스크톱 도구와 같은 식 ───────── */
const scoreToDamage = s => Math.pow((s + 10) / 4, 2);
const damageToScore = d => 4 * Math.sqrt(Math.max(0, d)) - 10;

const COLORS = ["#D85A30", "#185FA5", "#639922", "#993556", "#854F0B", "#3C3489"];
const DARK_COLORS = ["#ff8a5c", "#6fb3f2", "#8fd14f", "#ef7fa5", "#e0ab48", "#8f8ae0"];

const MARGIN = { l: 56, r: 18, t: 20, b: 34 };
const KEY = "gf2-score-tool";

let yMax = 40000;
let entries = [];          // {score, damage, idx}
let selected = new Set();
let hover = null;

const cv = document.getElementById("chart");
const ctx = cv.getContext("2d");
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const isDark = () => document.documentElement.dataset.theme === "dark";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorOf = e => (isDark() ? DARK_COLORS : COLORS)[e.idx % COLORS.length];

const xMaxM = () => (scoreToDamage(yMax) / 1e6) * 1.05;
const xToPx = (dm, w) => MARGIN.l + (dm / xMaxM()) * (w - MARGIN.l - MARGIN.r);
const yToPx = (s, h) => h - MARGIN.b - (s / yMax) * (h - MARGIN.t - MARGIN.b);
const pxToDamageM = (px, w) => {
  const usable = w - MARGIN.l - MARGIN.r;
  return Math.min(Math.max((px - MARGIN.l) / usable, 0), 1) * xMaxM();
};

/* ───────── 그리기 ───────── */
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = css("--plot-bg");
  ctx.fillRect(0, 0, w, h);

  ctx.font = '11px "Malgun Gothic", sans-serif';
  ctx.lineWidth = 1;

  // 가로 눈금 — 점수
  const step = Math.max(1000, Math.round(yMax / 8 / 1000) * 1000);
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let y = 0; y <= yMax; y += step) {
    const py = Math.round(yToPx(y, h)) + 0.5;
    ctx.strokeStyle = css("--grid-y");
    ctx.beginPath(); ctx.moveTo(MARGIN.l, py); ctx.lineTo(w - MARGIN.r, py); ctx.stroke();
    ctx.fillStyle = css("--tick");
    ctx.fillText(fmt(y), MARGIN.l - 6, py);
  }

  // 세로 눈금 — 피해량(백만)
  const xmax = xMaxM();
  const xstep = Math.max(1, Math.round(xmax / 8));
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let x = 0; x <= xmax; x += xstep) {
    const px = Math.round(xToPx(x, w)) + 0.5;
    ctx.strokeStyle = css("--grid-x");
    ctx.beginPath(); ctx.moveTo(px, MARGIN.t); ctx.lineTo(px, h - MARGIN.b); ctx.stroke();
    ctx.fillStyle = css("--tick");
    ctx.fillText(fmt(x) + "M", px, h - MARGIN.b + 6);
  }

  // 축
  ctx.strokeStyle = css("--axis");
  ctx.beginPath();
  ctx.moveTo(MARGIN.l, h - MARGIN.b + 0.5); ctx.lineTo(w - MARGIN.r, h - MARGIN.b + 0.5);
  ctx.moveTo(MARGIN.l + 0.5, MARGIN.t); ctx.lineTo(MARGIN.l + 0.5, h - MARGIN.b);
  ctx.stroke();

  // 곡선
  ctx.strokeStyle = css("--curve");
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const xm = xmax * i / 200;
    const s = Math.min(damageToScore(xm * 1e6), yMax);
    const px = xToPx(xm, w), py = yToPx(s, h);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  ctx.lineWidth = 1;

  // 점
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.font = 'bold 11px "Malgun Gothic", sans-serif';
  for (const e of entries) {
    const px = xToPx(e.damage / 1e6, w), py = yToPx(e.score, h);
    const c = colorOf(e);
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillText(fmt(e.score), px, py - 8);
  }

  // 커서 안내선
  if (hover) {
    const px = xToPx(hover.dm, w), py = yToPx(hover.score, h);
    ctx.save();
    ctx.setLineDash([3, 2]);
    ctx.strokeStyle = css("--hair");
    ctx.beginPath(); ctx.moveTo(px, MARGIN.t); ctx.lineTo(px, h - MARGIN.b); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = COLORS[0];
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();

    const label = `점수 ${fmt(hover.score)}  ·  피해 ${fmt(hover.dm * 1e6)}`;
    ctx.font = 'bold 12px "Malgun Gothic", sans-serif';
    const tw = ctx.measureText(label).width;
    const right = px < w - tw - 30;
    const bx = right ? px + 10 : px - 10 - tw - 8;
    const by = Math.max(py - 26, MARGIN.t + 2);
    ctx.fillStyle = css("--tip-bg");
    ctx.strokeStyle = css("--tip-line");
    ctx.beginPath(); ctx.rect(bx, by, tw + 8, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = css("--tip-fg");
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(label, bx + 4, by + 10);
  }
}

/* ───────── 목록 ───────── */
function renderList() {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  document.getElementById("empty").style.display = entries.length ? "none" : "block";
  entries.forEach((e, i) => {
    const li = document.createElement("li");
    if (selected.has(i)) li.className = "sel";
    li.innerHTML = `<span class="dot"></span><span>점수 ${fmt(e.score)} → 피해 ${fmt(e.damage)}</span><span class="x">✕</span>`;
    li.querySelector(".dot").style.background = colorOf(e);
    li.addEventListener("click", ev => {
      if (ev.target.classList.contains("x")) { remove(i); return; }
      selected.has(i) ? selected.delete(i) : selected.add(i);
      renderList(); compare();
    });
    ul.appendChild(li);
  });
}

function recalcMax() {
  yMax = 40000;
  for (const e of entries) {
    if (e.score > yMax) yMax = Math.ceil(e.score / 1000) * 1000 + 5000;
  }
}

function addScore(s) {
  if (s < -10) return false;
  if (entries.some(e => Math.abs(e.score - s) < 0.5)) return false;
  entries.push({ score: s, damage: scoreToDamage(s), idx: entries.length });
  recalcMax();
  return true;
}

function remove(i) {
  entries.splice(i, 1);
  entries.forEach((e, n) => { e.idx = n; });
  selected.clear();
  recalcMax(); save(); renderList(); compare(); draw();
}

function compare() {
  const picked = [...selected].sort((a, b) => a - b).map(i => entries[i]).filter(Boolean);
  const el = document.getElementById("detail");
  if (picked.length === 0) { el.textContent = "목록에서 항목을 눌러 고르면 차이를 보여 줍니다."; return; }
  if (picked.length === 1) {
    const e = picked[0];
    el.textContent = `점수 ${fmt(e.score)}\n피해량 ${fmt(e.damage)}`;
    return;
  }
  const base = picked[0];
  let out = `기준: 점수 ${fmt(base.score)} · 피해 ${fmt(base.damage)}\n`;
  for (const e of picked.slice(1)) {
    const ds = e.score - base.score;
    const dd = e.damage - base.damage;
    const pct = base.damage ? dd / base.damage * 100 : 0;
    out += `\n점수 ${fmt(e.score)}  (${ds >= 0 ? "+" : ""}${fmt(ds)})`
        +  `\n  피해 ${fmt(e.damage)}  (${dd >= 0 ? "+" : ""}${fmt(dd)}, ${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%)\n`;
  }
  el.textContent = out.trim();
}

/* ───────── 저장 ───────── */
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ scores: entries.map(e => e.score) }));
  } catch (e) { /* 저장 못 해도 동작 */ }
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "{}");
    (d.scores || []).forEach(addScore);
  } catch (e) { /* 무시 */ }
}

/* ───────── 입력 ───────── */
document.getElementById("add").addEventListener("click", () => {
  const box = document.getElementById("score");
  let added = false;
  for (const part of box.value.split(/[,\s]+/)) {
    if (!part) continue;
    const v = Number(part.replace(/,/g, ""));
    if (Number.isFinite(v) && addScore(v)) added = true;
  }
  if (added) { box.value = ""; save(); renderList(); compare(); draw(); }
});
document.getElementById("score").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("add").click();
});
document.getElementById("clear").addEventListener("click", () => {
  entries = []; selected.clear(); recalcMax(); save(); renderList(); compare(); draw();
});

function pointFromEvent(ev) {
  const r = cv.getBoundingClientRect();
  const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
  if (x < MARGIN.l || x > cv.clientWidth - MARGIN.r) return null;
  const dm = pxToDamageM(x, cv.clientWidth);
  const s = damageToScore(dm * 1e6);
  return (s < 0 || s > yMax) ? null : { dm, score: s };
}
cv.addEventListener("pointermove", ev => { hover = pointFromEvent(ev); draw(); });
cv.addEventListener("pointerleave", () => { hover = null; draw(); });
cv.addEventListener("pointerdown", ev => { hover = pointFromEvent(ev); draw(); });
cv.addEventListener("dblclick", ev => {
  const p = pointFromEvent(ev);
  if (p && addScore(Math.round(p.score))) { save(); renderList(); compare(); draw(); }
});

/* ───────── 테마 ───────── */
const media = window.matchMedia("(prefers-color-scheme: dark)");
const btn = document.getElementById("theme");
function applyTheme(mode) {
  document.documentElement.dataset.theme = mode;
  btn.textContent = mode === "dark" ? "☀ 라이트" : "☾ 다크";
  renderList(); draw();
}
let stored = null;
try { stored = localStorage.getItem(KEY + "-theme"); } catch (e) { /* 무시 */ }
media.addEventListener("change", e => {
  let saved = null;
  try { saved = localStorage.getItem(KEY + "-theme"); } catch (e2) { /* 무시 */ }
  if (!saved) applyTheme(e.matches ? "dark" : "light");
});
btn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(KEY + "-theme", next); } catch (e) { /* 무시 */ }
});

window.addEventListener("resize", draw);
load();
applyTheme(stored || (media.matches ? "dark" : "light"));
renderList();
compare();
</script>
</body>
</html>
